name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt (Rust)
        run: cargo fmt --all -- --check

      - name: cargo build
        run: cargo build --workspace

      - name: fpas fmt --check (.fpas sources)
        run: cargo run -q -p fpas-cli -- fmt --check examples tests apps

      - name: cargo test
        run: cargo test --workspace
