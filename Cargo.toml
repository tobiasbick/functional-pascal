[workspace]
members = ["crates/*"]
resolver = "3"

[profile.release]
lto = "fat"
codegen-units = 1

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "BSD-3-Clause"
repository = "https://github.com/tobiasbick/functional-pascal"
description = "A modern, function-first programming language built on Pascal's readable syntax"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[workspace.dependencies]
agent-client-protocol = { version = "=3.5.0", features = ["schemars", "unstable_end_turn_token_usage", "unstable_llm_providers", "unstable_mcp_over_acp", "unstable_plan_operations", "unstable_session_fork", "unstable_session_system_prompt", "unstable_subagents", "unstable_protocol_v2"] }
agent-client-protocol-schema = { version = "=1.12.0", default-features = false, features = ["schemars", "unstable_end_turn_token_usage", "unstable_llm_providers", "unstable_mcp_over_acp", "unstable_plan_operations", "unstable_session_fork", "unstable_session_system_prompt", "unstable_subagents", "unstable_protocol_v2"] }
allocation-counter = "0.8.1"
blake3 = "1.8.7"
caseless = "0.2.2"
crossterm = "0.29.0"
glob = "0.3.4"
getrandom = "0.4.3"
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
libc = "0.2.191"
mimalloc = "0.1.52"
rand = "0.10.3"
rand_chacha = "0.10.0"
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "schemars", "transport-streamable-http-server"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
# Objects keep insertion order so Std.Json agrees with ordered FPAS dictionaries.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
socket2 = "0.6.5"
stats_alloc = "0.1.10"
toml = "1.1.8"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
