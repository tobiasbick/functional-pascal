[workspace]
members = ["crates/*"]
exclude = ["crates/hall-vm"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/tobiasbick/functional-pascal"
description = "A modern, function-first programming language built on Pascal's readable syntax"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[workspace.dependencies]
blake3 = "1.8.5"
caseless = "0.2.2"
crossterm = "0.29"
glob = "0.3"
libc = "0.2"
rand = "0.9"
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
toml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"
