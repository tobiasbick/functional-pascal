[package]
name = "fpas-bench"
description = "Harness for curated Functional Pascal end-to-end benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fpas-bench"
path = "src/main.rs"

[dependencies]
atomic-write-file = "0.3.0"
fpas-bytecode = { path = "../fpas-bytecode" }
fpas-compiler = { path = "../fpas-compiler" }
fpas-parser = { path = "../fpas-parser" }
fpas-vm = { path = "../fpas-vm" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
