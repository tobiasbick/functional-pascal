[package]
name = "fpas-bench"
description = "Harness for curated Functional Pascal end-to-end benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fpas-bench"
path = "src/main.rs"

[dependencies]
fpas-compiler = { path = "../fpas-compiler" }
fpas-parser = { path = "../fpas-parser" }
fpas-language-service = { path = "../fpas-language-service" }
fpas-unit = { path = "../fpas-unit" }
fpas-bytecode = { path = "../fpas-bytecode" }
fpas-program = { path = "../fpas-program" }
atomic-write-file = "0.3.0"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "process-group"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
