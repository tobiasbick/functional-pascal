[package]
name = "fpas-cli"
default-run = "fpas"
description = "Command-line interface for the Functional Pascal compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fpas"
path = "src/main.rs"

[[bin]]
name = "fpas-runner"
path = "src/bin/fpas-runner.rs"

[dependencies]
atomic-write-file = "0.3.1"
ring = "0.17.14"
mimalloc = { workspace = true }
fpas-project = { path = "../fpas-project" }
fpas-fmt = { path = "../fpas-fmt" }
fpas-language-service = { path = "../fpas-language-service" }
fpas-lexer = { path = "../fpas-lexer" }
fpas-parser = { path = "../fpas-parser" }
fpas-compiler = { path = "../fpas-compiler" }
fpas-bytecode = { path = "../fpas-bytecode" }
fpas-build = { path = "../fpas-build" }
fpas-bundle = { path = "../fpas-bundle" }
fpas-program = { path = "../fpas-program" }
fpas-diagnostics = { path = "../fpas-diagnostics" }
fpas-vm = { path = "../fpas-vm" }
fpas-debug = { path = "../fpas-debug" }
fpas-lsp = { path = "../fpas-lsp" }
fpas-std = { path = "../fpas-std" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["process", "signal"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-session"] }
rustix = { version = "1.1.5", features = ["process"] }

[dev-dependencies]
rcgen.workspace = true
rustls.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["term", "fs"] }

[lints]
workspace = true

