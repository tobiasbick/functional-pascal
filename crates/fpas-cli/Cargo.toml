[package]
name = "fpas-cli"
default-run = "fpas"
description = "Command-line interface for the Functional Pascal compiler"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fpas"
path = "src/main.rs"

[dependencies]
atomic-write-file = "0.3.1"
ring = "0.17.14"
mimalloc = { workspace = true }
fpas-project = { path = "../fpas-project" }
fpas-fmt = { path = "../fpas-fmt" }
fpas-language-service = { path = "../fpas-language-service" }
fpas-lexer = { path = "../fpas-lexer" }
fpas-parser = { path = "../fpas-parser" }
fpas-compiler = { path = "../fpas-compiler" }
fpas-build = { path = "../fpas-build" }
fpas-bundle = { path = "../fpas-bundle" }
fpas-program = { path = "../fpas-program" }
fpas-diagnostics = { path = "../fpas-diagnostics" }
fpas-debug = { path = "../fpas-debug" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

fpas-runtime = { path = "../fpas-runtime" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["process", "signal"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-session"] }
rustix = { version = "1.1.5", features = ["process"] }

[dev-dependencies]
rcgen.workspace = true
rustls.workspace = true
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }

[[test]]
name = "language"
path = "tests/language/main.rs"

[[test]]
name = "tools"
path = "tests/tools/main.rs"

[[test]]
name = "host_io"
path = "tests/host_io/main.rs"

[[test]]
name = "distribution"
path = "tests/distribution/main.rs"

[[test]]
name = "proc_pipes"
path = "tests/proc_pipes.rs"

[[test]]
name = "failure_dump"
path = "tests/failure_dump.rs"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["term", "fs"] }

[lints]
workspace = true
