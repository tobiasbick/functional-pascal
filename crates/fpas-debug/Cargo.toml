[package]
name = "fpas-debug"
autotests = false
description = "Source debugger protocols for Functional Pascal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fpas-diagnostics = { path = "../fpas-diagnostics" }
fpas-lexer = { path = "../fpas-lexer" }
fpas-parser = { path = "../fpas-parser" }
serde_json = { workspace = true }

fpas-runtime = { path = "../fpas-runtime" }

[lints]
workspace = true

[dev-dependencies]
fpas-compiler = { path = "../fpas-compiler" }
fpas-linker = { path = "../fpas-linker" }
fpas-unit = { path = "../fpas-unit" }
fpas-program = { path = "../fpas-program" }

[[test]]
name = "dap_protocol"
path = "tests/suites/dap_protocol.rs"

[[test]]
name = "jsonl_protocol"
path = "tests/suites/jsonl_protocol.rs"

[[test]]
name = "execution_control"
path = "tests/suites/execution_control.rs"

[[test]]
name = "storage_mutation"
path = "tests/suites/storage_mutation.rs"

[[test]]
name = "evaluation"
path = "tests/suites/evaluation.rs"
