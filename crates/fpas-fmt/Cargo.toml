[package]
name = "fpas-fmt"
description = "Canonical source formatter for Functional Pascal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "formatting"
path = "tests/suites/formatting.rs"

[[test]]
name = "syntax"
path = "tests/suites/syntax.rs"

[[test]]
name = "corpus"
path = "tests/suites/corpus.rs"

[dependencies]
fpas-parser = { path = "../fpas-parser" }
fpas-lexer = { path = "../fpas-lexer" }
unicode-width.workspace = true

[lints]
workspace = true
