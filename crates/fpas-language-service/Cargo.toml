[package]
name = "fpas-language-service"
autotests = false
description = "Editor-oriented analysis services for Functional Pascal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fpas-diagnostics = { path = "../fpas-diagnostics" }
fpas-fmt = { path = "../fpas-fmt" }
fpas-lexer = { path = "../fpas-lexer" }
fpas-parser = { path = "../fpas-parser" }
fpas-project = { path = "../fpas-project" }
fpas-sema = { path = "../fpas-sema" }
fpas-unit = { path = "../fpas-unit" }

[lints]
workspace = true

[[test]]
name = "analysis_state"
path = "tests/suites/analysis_state.rs"

[[test]]
name = "project_context"
path = "tests/suites/project_context.rs"

[[test]]
name = "editor_queries"
path = "tests/suites/editor_queries.rs"

[[test]]
name = "navigation_edits"
path = "tests/suites/navigation_edits.rs"
