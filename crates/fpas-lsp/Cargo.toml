[package]
name = "fpas-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Language Server Protocol transport for Functional Pascal"
autotests = false

[[test]]
name = "analysis"
path = "tests/suites/analysis.rs"

[[test]]
name = "editing"
path = "tests/suites/editing.rs"

[[test]]
name = "workspace"
path = "tests/suites/workspace.rs"

[[test]]
name = "process"
path = "tests/process.rs"

[[test]]
name = "protocol"
path = "tests/protocol.rs"

[dependencies]
fpas-diagnostics = { path = "../fpas-diagnostics" }
fpas-language-service = { path = "../fpas-language-service" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
tower = "0.5.3"
tower-lsp-server = "=0.23.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
fpas-fmt = { path = "../fpas-fmt" }
fpas-parser = { path = "../fpas-parser" }
tokio = { version = "1.54.1", features = ["io-util", "process"] }

[lints]
workspace = true
