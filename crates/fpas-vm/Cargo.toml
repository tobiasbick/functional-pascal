[package]
name = "fpas-vm"
description = "Virtual machine and bytecode interpreter for Functional Pascal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fpas-acp = { path = "../fpas-acp" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
fpas-numeric = { path = "../fpas-numeric" }
ctrlc = { version = "3.5.2", features = ["termination"] }
crossterm.workspace = true
fpas-bytecode = { path = "../fpas-bytecode" }
fpas-diagnostics = { path = "../fpas-diagnostics" }
fpas-std = { path = "../fpas-std" }
getrandom.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
socket2.workspace = true
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { version = "0.31.3", features = ["fs", "signal", "term", "process"] }
rustix = { version = "1.1.5", features = ["process"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "io-util"] }

[dev-dependencies]
fpas-compiler = { path = "../fpas-compiler" }
fpas-parser = { path = "../fpas-parser" }
rcgen.workspace = true
stats_alloc.workspace = true

[lints]
workspace = true

