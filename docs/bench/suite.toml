# Curated FPAS end-to-end benchmarks for `cargo bench-fpas`.
# Paths are relative to the repository root.
# Groups: `vm` (interpreter hot paths), `concurrency` (task scheduling), and
# `tui` (headless Std.Tui). Every row runs through the production `fpas run` path.

[[bench]]
id = "integer_loop"
group = "vm"
path = "examples/pascal/vm/integer_loop_benchmark.fpas"
args = ["50000000"]
timeout_ms = 120000

