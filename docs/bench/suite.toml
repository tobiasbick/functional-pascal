# Curated FPAS end-to-end benchmarks for `cargo bench-fpas`.
# Paths are relative to the repository root.
# Groups: `vm` (interpreter hot paths), `concurrency` (task scheduling),
# `tui` (headless Std.Tui).

[[bench]]
id = "integer_loop"
group = "vm"
path = "examples/pascal/vm/integer_loop_benchmark.fpas"
args = ["50000000"]

[[bench]]
id = "array_push"
group = "vm"
path = "examples/pascal/vm/array_push_benchmark.fpas"
args = ["2000000"]

[[bench]]
id = "array_length"
group = "vm"
path = "examples/pascal/vm/array_length_benchmark.fpas"
args = ["500000"]

[[bench]]
id = "string_concat"
group = "vm"
path = "examples/pascal/vm/string_concat_benchmark.fpas"
args = ["5000000"]

[[bench]]
id = "string_length"
group = "vm"
path = "examples/pascal/vm/string_length_benchmark.fpas"
args = ["500000"]

[[bench]]
id = "function_call"
group = "vm"
path = "examples/pascal/vm/function_call_benchmark.fpas"
args = ["3000000"]

[[bench]]
id = "array_callbacks"
group = "vm"
path = "examples/pascal/vm/array_callbacks_benchmark.fpas"
args = ["50000"]

[[bench]]
id = "record_update"
group = "vm"
path = "examples/pascal/vm/record_update_benchmark.fpas"
args = ["1000000"]

[[bench]]
id = "unicode_char_at"
group = "vm"
path = "examples/pascal/vm/unicode_char_at_benchmark.fpas"
args = ["3000000"]

[[bench]]
id = "task_spawn_wait"
group = "concurrency"
path = "examples/pascal/concurrency/task_spawn_wait_benchmark.fpas"
args = ["100000"]

[[bench]]
id = "tui_headless"
group = "tui"
path = "examples/pascal/tui/headless_render_benchmark.fpas"
args = ["500"]
